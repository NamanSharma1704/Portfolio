name: Checks

# Typecheck, lint, build, then the smoke tests in Chromium, Firefox and
# WebKit (Safari's engine), desktop and phone. WebKit runs here rather than
# only on a developer's machine: on Windows, Smart App Control can refuse
# Playwright's unsigned WebKit build.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Node 22: Node 20 reached the end of its support in April 2026.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - name: Install the test browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run test:e2e

      - name: Keep the traces of any failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
